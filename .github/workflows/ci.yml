name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject tracked credential files
        shell: pwsh
        run: |
          $trackedCredentialFiles = @(
            git ls-files |
              Where-Object {
                (
                  $_ -match '(^|/)\.env($|\.)' -and
                  $_ -notmatch '(^|/)\.env\.example$'
                ) -or
                $_ -match '(^|/)(\.envrc|\.pypirc)$' -or
                $_ -match '(^|/)\.direnv/'
              }
          )
          if ($trackedCredentialFiles.Count -gt 0) {
            Write-Error (
              "Private credential files must not be tracked: " +
              ($trackedCredentialFiles -join ", ")
            )
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: >-
          python -m compileall -q
          config.py
          languages.py
          main.py
          settings_ui.py
          strings.py
          subtitle_ui.py
          summarizer.py
          transcript.py
          translator.py
          translator_common.py
          translator_openai.py
          tests

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
